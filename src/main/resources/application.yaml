spring:
  application:
    name: bci-test
  jackson:
    time-zone: America/Santiago
  datasource:
    url: jdbc:h2:mem:bcidb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Santiago
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/bci-test}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: API RESTful de registro, autenticación y consulta de usuarios
    encoding: UTF-8
    time-zone: America/Santiago

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:WKFLKkvbVrezKZLXqU0sUPrXbTeajn9/Cjidypm89fk=}
    expiration-ms: 3600000
  password:
    regex: "^(?=.*[A-Z])(?=.*[a-z])(?=.*\\d).{8,}$"